<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', -apple-system, sans-serif; width: 380px; max-height: 520px; background: #0a0a0a; color: #fafafa; }

    .header { padding: 16px 16px 12px; border-bottom: 1px solid #1e1e1e; }
    .header h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .header h1 .brandmark { width: 22px; height: 22px; border-radius: 6px; }
    .header .site { font-size: 11px; color: #71717a; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* View tabs (On this page / History) */
    .view-tabs { display: flex; border-bottom: 1px solid #1e1e1e; padding: 0 16px; }
    .view-tab {
      background: none; border: none; color: #71717a;
      font-size: 12px; font-weight: 600; padding: 9px 12px;
      cursor: pointer; font-family: inherit;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }
    .view-tab:hover { color: #fafafa; }
    .view-tab.active { color: #60a5fa; border-bottom-color: #60a5fa; }

    /* History view */
    .history-search {
      margin: 10px 16px 6px; padding: 7px 10px;
      background: #18181b; border: 1px solid #27272a; border-radius: 6px;
      color: #fafafa; font-size: 12px; font-family: inherit; width: calc(100% - 32px);
      outline: none;
    }
    .history-search:focus { border-color: #60a5fa; }
    /* Custom clear (X) button for the history search (#8). A theme-matched
       button that works in every browser, unlike the native search clear
       (Chrome-only, dark-on-dark; absent in Firefox). */
    .history-search-wrap { position: relative; margin: 10px 16px 6px; }
    .history-search-wrap .history-search { margin: 0; width: 100%; padding-right: 30px; }
    /* Hide the native Chrome clear so there aren't two X's. */
    .history-search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
    .history-search-clear {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
      background: none; border: 0; color: #71717a; cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 4px; font-family: inherit;
    }
    .history-search-clear:hover { color: #fafafa; }
    .history-list { padding: 0 16px 12px; max-height: 380px; overflow-y: auto; }
    .history-list::-webkit-scrollbar { width: 4px; }
    .history-list::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    .history-item {
      background: #111113; border: 1px solid #1e1e1e; border-radius: 8px;
      padding: 8px 10px; margin-bottom: 5px; cursor: pointer;
      transition: border-color 0.15s;
    }
    .history-item:hover { border-color: #60a5fa; }
    .history-row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .history-value { font-size: 13px; font-weight: 600; color: #fafafa; word-break: break-all; }
    .history-when { font-size: 10px; color: #71717a; white-space: nowrap; flex-shrink: 0; }
    .history-row2 { font-size: 10px; color: #52525b; margin-top: 2px; display: flex; gap: 6px; }
    .history-type {
      font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 6px;
      background: #18181b; color: #a1a1aa; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .history-empty { padding: 40px 16px; text-align: center; color: #52525b; font-size: 13px; }
    .history-footer {
      padding: 8px 16px 12px; border-top: 1px solid #1e1e1e;
      display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap;
    }
    .history-clear {
      background: none; border: none; color: #71717a;
      font-size: 11px; cursor: pointer; font-family: inherit;
    }
    .history-clear:hover { color: #f87171; }
    .history-export {
      background: none; border: 1px solid #27272a; color: #a1a1aa;
      font-size: 11px; padding: 3px 9px; border-radius: 6px;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .history-export:hover { border-color: #60a5fa; color: #60a5fa; }

    .status { padding: 10px 16px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot-green { background: #4ade80; }

    /* Network transparency row -- the receipts for "nothing leaves your browser" */
    .net-row {
      margin: 0 16px 6px; padding: 6px 9px; border-radius: 7px;
      font-size: 10.5px; line-height: 1.45; display: block;
      background: rgba(96,165,250,0.07); border: 1px solid rgba(96,165,250,0.18);
      color: #94a3b8;
    }
    .net-dot {
      width: 6px; height: 6px; border-radius: 50%; background: #4ade80;
      display: inline-block; margin-right: 5px; vertical-align: middle;
    }
    .net-dot.warn { background: #fbbf24; }
    .net-zero { color: #a1a1aa; }
    .net-what { color: #52525b; }
    .net-list { margin: 4px 0 0 16px; padding: 0; color: #71717a; font-size: 10px; }
    .net-list li { margin: 1px 0; }
    .dot-yellow { background: #fbbf24; }
    .dot-red { background: #f87171; }

    .section { padding: 8px 16px; }
    .section-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #52525b; margin-bottom: 8px; }

    .contact-item {
      background: #111113; border: 1px solid #1e1e1e; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 6px;
      transition: border-color 0.2s;
    }
    .contact-item:hover { border-color: #60a5fa; }
    .contact-main { cursor: pointer; }
    .contact-item .value { font-size: 14px; font-weight: 600; color: #fafafa; word-break: break-all; }
    .contact-item .meta { font-size: 11px; color: #52525b; margin-top: 3px; display: flex; justify-content: space-between; align-items: center; }
    .contact-item .score { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 8px; }

    /* Action toggle, panel, and chips (Compose templates / VOIP call-via) */
    .actions-toggle {
      background: none; border: none; color: #71717a;
      font-size: 11px; cursor: pointer; padding: 6px 0 0;
      font-family: inherit; display: inline-flex; align-items: center; gap: 4px;
      transition: color 0.2s;
    }
    .actions-toggle:hover { color: #60a5fa; }
    .actions-toggle .caret { display: inline-block; transition: transform 0.2s; }
    .actions-toggle.open .caret { transform: rotate(180deg); }
    .actions-panel { margin-top: 6px; display: none; }
    .actions-panel.open { display: block; }
    .row-actions { display: flex; gap: 14px; align-items: center; }
    .vcard-btn { font-variant-numeric: tabular-nums; }
    .client-picker {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
      padding: 0 0 8px;
    }
    .picker-label {
      font-size: 10px; color: #52525b; text-transform: uppercase;
      letter-spacing: 0.5px; margin-right: 4px;
    }
    .action-chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .action-chip {
      background: #18181b; border: 1px solid #27272a;
      color: #d4d4d8; font-size: 11px; padding: 4px 9px;
      border-radius: 12px; cursor: pointer; font-family: inherit;
      transition: all 0.15s; white-space: nowrap;
    }
    .action-chip:hover { border-color: #60a5fa; color: #60a5fa; }
    .action-chip.selected {
      background: rgba(96,165,250,0.15);
      border-color: #60a5fa; color: #60a5fa;
    }
    /* Draft outreach (Pro) */
    .outreach-block { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #27272a; }
    .outreach-label {
      font-size: 10px; color: #60a5fa; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
    }
    .pro-tag { font-size: 8px; background: rgba(96,165,250,0.15); color: #60a5fa; padding: 1px 5px; border-radius: 6px; letter-spacing: 0.5px; }
    .outreach-chip { border-color: rgba(96,165,250,0.35); }
    .outreach-chip:hover { border-color: #60a5fa; color: #60a5fa; }
    .sender-form { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .sender-hint { font-size: 10px; color: #71717a; }
    .sender-form input {
      background: #18181b; border: 1px solid #27272a; border-radius: 6px;
      color: #fafafa; font-size: 12px; padding: 6px 9px; font-family: inherit; outline: none;
    }
    .sender-form input:focus { border-color: #60a5fa; }
    .sender-save {
      background: #60a5fa; color: #0a0a0a; font-weight: 700; font-size: 12px;
      padding: 6px 10px; border-radius: 6px; border: 0; cursor: pointer; font-family: inherit; align-self: flex-start;
    }
    .sender-save:hover { background: #93c5fd; }
    .score-high { background: rgba(74,222,128,0.15); color: #4ade80; }
    .score-mid { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .score-low { background: rgba(161,161,170,0.15); color: #a1a1aa; }

    /* Email-quality hint badge (local triage: Direct / Personal / Role inbox / Disposable) */
    .email-quality { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 6px; letter-spacing: 0.3px; }
    .q-good { background: rgba(74,222,128,0.15); color: #4ade80; }
    .q-ok { background: rgba(56,189,248,0.15); color: #38bdf8; }
    .q-warn { background: rgba(251,191,36,0.15); color: #fbbf24; }
    .q-bad { background: rgba(248,113,113,0.15); color: #f87171; }

    /* Provenance / freshness stamp (where on the page each contact was found) */
    .provenance { font-size: 9px; color: #71717a; font-weight: 600; cursor: help; }

    .copied { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #60a5fa; color: #0a0a0a; padding: 6px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; display: none; z-index: 10; }
    .copied.show { display: block; }

    .link-item {
      display: block; padding: 8px 12px; background: #111113; border: 1px solid #1e1e1e;
      border-radius: 8px; margin-bottom: 6px; text-decoration: none;
      font-size: 13px; color: #60a5fa; transition: border-color 0.2s;
      overflow-wrap: anywhere; word-break: break-word;
    }
    .link-item:hover { border-color: #60a5fa; }
    .link-item .link-label { font-size: 11px; color: #52525b; overflow-wrap: anywhere; word-break: break-word; }

    .empty { padding: 24px 16px; text-align: center; color: #52525b; font-size: 13px; line-height: 1.5; }
    .empty strong { color: #71717a; }

    .scanning { padding: 40px 16px; text-align: center; color: #52525b; font-size: 13px; }
    .scanning .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #27272a; border-top-color: #60a5fa; border-radius: 50%; animation: spin 0.6s linear infinite; margin-bottom: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .scroll { max-height: 420px; overflow-y: auto; padding-bottom: 8px; }
    .scroll::-webkit-scrollbar { width: 4px; }
    .scroll::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }

    .rescan-btn {
      display: block; width: calc(100% - 32px); margin: 8px 16px 12px; padding: 8px;
      background: #18181b; border: 1px solid #27272a; border-radius: 8px;
      color: #60a5fa; font-size: 12px; font-weight: 600; cursor: pointer;
      font-family: inherit; transition: border-color 0.2s; text-align: center;
    }
    .rescan-btn:hover { border-color: #60a5fa; }

    /* Export bar (CSV / vCard) -- sits above the rescan button */
    .export-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 10px 16px 0;
    }
    .export-label {
      font-size: 10px; color: #52525b; text-transform: uppercase;
      letter-spacing: 0.5px; margin-right: auto;
    }
    .export-btn {
      background: #18181b; border: 1px solid #27272a; color: #d4d4d8;
      font-size: 11px; font-weight: 600; padding: 5px 11px; border-radius: 12px;
      cursor: pointer; font-family: inherit; transition: all 0.15s; white-space: nowrap;
    }
    .export-btn:hover { border-color: #60a5fa; color: #60a5fa; }

    /* Webhook / Send to CRM inline capture row */
    .webhook-row {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px 0;
    }
    .webhook-row[hidden] { display: none; }
    .webhook-input {
      flex: 1; min-width: 0; background: #18181b; border: 1px solid #27272a;
      border-radius: 6px; color: #fafafa; font-size: 11px; padding: 6px 9px;
      font-family: inherit; outline: none;
    }
    .webhook-input:focus { border-color: #60a5fa; }
    .webhook-save {
      background: #18181b; border: 1px solid #27272a; color: #d4d4d8;
      font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 6px;
      cursor: pointer; font-family: inherit; white-space: nowrap; transition: all 0.15s;
    }
    .webhook-save:hover { border-color: #60a5fa; color: #60a5fa; }
    .webhook-cancel {
      background: none; border: none; color: #71717a; font-size: 16px;
      line-height: 1; cursor: pointer; font-family: inherit; padding: 2px 4px;
    }
    .webhook-cancel:hover { color: #f87171; }

    /* Hours section */
    .hours-banner {
      margin: 0 16px 8px; padding: 12px 14px;
      background: linear-gradient(135deg, rgba(96,165,250,0.08), rgba(96,165,250,0.02));
      border: 1px solid rgba(96,165,250,0.2); border-radius: 10px;
      display: flex; align-items: center; gap: 10px;
    }
    .hours-banner.closed {
      background: linear-gradient(135deg, rgba(248,113,113,0.08), rgba(248,113,113,0.02));
      border-color: rgba(248,113,113,0.2);
    }
    .hours-banner.unknown {
      background: rgba(161,161,170,0.06);
      border-color: rgba(161,161,170,0.2);
    }
    .hours-banner .pulse {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
      background: #4ade80; box-shadow: 0 0 0 0 rgba(74,222,128,0.7);
      animation: pulse 2s infinite;
    }
    .hours-banner.closed .pulse { background: #f87171; box-shadow: 0 0 0 0 rgba(248,113,113,0.7); }
    .hours-banner.unknown .pulse { background: #71717a; animation: none; box-shadow: none; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.5); }
      70% { box-shadow: 0 0 0 8px rgba(74,222,128,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }
    .hours-banner .status-text { flex: 1; }
    .hours-banner .status-label {
      font-size: 13px; font-weight: 700; color: #fafafa; line-height: 1.2;
    }
    .hours-banner.closed .status-label { color: #fca5a5; }
    .hours-banner.open .status-label { color: #86efac; }
    .hours-banner .status-detail {
      font-size: 11px; color: #71717a; margin-top: 2px;
    }

    .hours-list {
      margin: 4px 16px 8px; padding: 10px 12px;
      background: #111113; border: 1px solid #1e1e1e; border-radius: 8px;
    }
    .hours-row {
      display: flex; justify-content: space-between;
      font-size: 12px; padding: 3px 0;
      color: #a1a1aa;
    }
    .hours-row.today { color: #fafafa; font-weight: 600; }
    .hours-row .day { text-transform: capitalize; }

    /* Review prompt toast (one-time, after PROMPT_THRESHOLD copies) */
    .review-toast {
      margin: 10px 16px;
      padding: 12px 38px 12px 14px;
      background: linear-gradient(135deg, rgba(96,165,250,0.10), rgba(96,165,250,0.04));
      border: 1px solid rgba(96,165,250,0.25);
      border-radius: 10px;
      position: relative;
    }
    .review-toast-close {
      position: absolute; top: 6px; right: 8px;
      background: none; border: none; color: #71717a;
      font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 6px;
      font-family: inherit;
    }
    .review-toast-close:hover { color: #fafafa; }
    .review-toast-title {
      font-size: 13px; font-weight: 700; color: #fafafa;
      display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
    }
    .review-toast-title .star { color: #fbbf24; font-size: 14px; }
    .review-toast-body { font-size: 12px; color: #a1a1aa; margin-bottom: 10px; }
    .review-toast-actions { display: flex; gap: 8px; }
    .review-btn-primary, .review-btn-secondary {
      font-family: inherit; font-size: 11px; font-weight: 700;
      padding: 6px 12px; border-radius: 6px; cursor: pointer;
      transition: all 0.15s; border: 1px solid transparent;
    }
    .review-btn-primary { background: #60a5fa; color: #0a0a0a; border-color: #60a5fa; }
    .review-btn-primary:hover { background: #93c5fd; border-color: #93c5fd; }
    .review-btn-secondary { background: transparent; color: #a1a1aa; border-color: #27272a; }
    .review-btn-secondary:hover { color: #fafafa; border-color: #60a5fa; }

    /* Settings row (Show side panel toggle) */
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 16px; border-top: 1px solid #1e1e1e;
      font-size: 12px; color: #d4d4d8;
    }
    .settings-row .label { display: inline-flex; align-items: center; gap: 6px; }
    .settings-row .label small { color: #71717a; font-size: 10px; }
    .switch {
      position: relative; width: 32px; height: 18px;
      background: #27272a; border-radius: 999px; cursor: pointer;
      transition: background 0.15s; flex-shrink: 0;
    }
    .switch::after {
      content: ""; position: absolute; top: 50%; left: 2px;
      width: 14px; height: 14px; border-radius: 50%; background: #fafafa;
      /* Center vertically off the midline rather than a hardcoded top offset,
         so the knob never reads as high/low from sub-pixel rounding (#5). */
      transform: translateY(-50%);
      transition: transform 0.15s;
    }
    .switch.on { background: #60a5fa; }
    /* Keep the vertical centering while sliding across (track 32 − knob 14 −
       2px each side = 14px of travel). */
    .switch.on::after { transform: translate(14px, -50%); }

    /* Always-visible rate footer link */
    .rate-footer {
      text-align: center; padding: 8px 16px 12px;
      border-top: 1px solid #1e1e1e;
    }
    .rate-footer a {
      color: #71717a; font-size: 11px; text-decoration: none;
      display: inline-flex; align-items: center; gap: 4px;
      transition: color 0.15s;
    }
    .rate-footer a:hover { color: #60a5fa; }

    /* One-time rebrand notice (shown only to 1.x updaters) */
    .rebrand-banner {
      margin: 10px 16px 0; padding: 9px 11px;
      background: rgba(96,165,250,0.12); border: 1px solid rgba(96,165,250,0.35);
      border-radius: 8px; font-size: 11.5px; line-height: 1.45; color: #d4d4d8;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .rebrand-banner strong { color: #fafafa; }
    .rebrand-dismiss {
      background: none; border: none; color: #71717a; cursor: pointer;
      font-size: 12px; font-family: inherit; padding: 0 2px; flex-shrink: 0;
    }
    .rebrand-dismiss:hover { color: #fafafa; }
    .rate-footer .star { color: #fbbf24; }

    /* Pro / upgrade footer (LemonSqueezy) */
    .pro-footer:empty { display: none; }
    .pro-footer {
      padding: 10px 16px; border-top: 1px solid #1e1e1e;
      display: flex; flex-direction: column; gap: 8px; font-size: 12px;
    }
    .pro-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pro-row .pro-label { color: #d4d4d8; display: inline-flex; align-items: center; gap: 6px; }
    .pro-row .pro-label .bolt { color: #fbbf24; }
    .pro-pill { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
    .pro-pill.on { background: rgba(96,165,250,0.15); color: #60a5fa; }
    .pro-early { font-size: 11px; color: #60a5fa; font-weight: 600; }
    .pro-cta {
      background: #60a5fa; color: #0a0a0a; font-weight: 700; font-size: 12px;
      padding: 6px 12px; border-radius: 8px; border: 0; cursor: pointer; font-family: inherit;
    }
    .pro-cta:hover { background: #93c5fd; }
    .pro-activate { display: flex; gap: 6px; }
    .pro-activate input {
      flex: 1; background: #18181b; border: 1px solid #27272a; border-radius: 6px;
      color: #fafafa; font-size: 12px; padding: 6px 9px; font-family: inherit; outline: none;
    }
    .pro-activate input:focus { border-color: #60a5fa; }
    .pro-activate button {
      background: #18181b; border: 1px solid #27272a; color: #d4d4d8;
      font-size: 12px; padding: 6px 11px; border-radius: 6px; cursor: pointer; font-family: inherit;
    }
    .pro-activate button:hover { border-color: #60a5fa; color: #60a5fa; }
    .pro-msg { font-size: 11px; }
    .pro-msg.ok { color: #4ade80; }
    .pro-msg.err { color: #f87171; }
    /* What Pro includes — shown above the Upgrade button so the value is clear
       before checkout (QA #3). */
    .pro-features { list-style: none; margin: 6px 0 8px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; }
    .pro-features li { font-size: 11px; color: #a1a1aa; display: flex; align-items: baseline; gap: 5px; line-height: 1.35; }
    .pro-features li::before { content: "✓"; color: #4ade80; font-weight: 700; font-size: 10px; }
    .pro-more { font-size: 11px; }
    .pro-more a { color: #60a5fa; text-decoration: none; }
    .pro-more a:hover { text-decoration: underline; }
    .pro-manage { background: none; border: none; color: #71717a; font-size: 11px; cursor: pointer; font-family: inherit; padding: 0; }
    .pro-manage:hover { color: #f87171; }
    /* Advocacy tab */
    .adv-wrap{padding-bottom:8px}
    .adv-hint,.adv-note{font-size:11px;color:#a1a1aa;margin:4px 0 8px;line-height:1.45}
